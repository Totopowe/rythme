<!-- Gabarit « Magic Link » ET « Confirm signup » (Supabase → Authentication → Emails → Templates).
     Objet conseillé : « Ton code Rythme : {{ .Token }} » -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1c1c1a">
  <p style="font-size:15px;margin:0 0 24px;color:#686863">Rythme</p>
  <h1 style="font-size:22px;font-weight:600;margin:0 0 12px">Ton code de connexion</h1>
  <p style="font-size:15px;line-height:24px;margin:0 0 20px">Saisis ce code dans l’app :</p>
  <p style="font-size:34px;font-weight:600;letter-spacing:8px;margin:0 0 28px;font-family:ui-monospace,Menlo,monospace">{{ .Token }}</p>
  <p style="font-size:15px;line-height:24px;margin:0 0 20px">Ou connecte-toi directement depuis cet appareil :</p>
  <p style="margin:0 0 32px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#0b7d68;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 20px;border-radius:10px">Me connecter</a>
  </p>
  <p style="font-size:13px;line-height:20px;color:#686863;margin:0">Le code expire dans une heure. Si tu n’as rien demandé, ignore simplement cet e-mail.</p>
</div>
